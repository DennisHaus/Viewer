<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dynamic Landscape Tool</title>

  <link rel="stylesheet" href="./style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <main id="app">

    <section id="viewer"></section>

    <aside id="interface">

      <header>
        <div class="eyebrow">
          REAL-TIME LANDSCAPE MODEL
        </div>

        <h1>
          SEDIMENT<br>
          FLOW
        </h1>

        <p class="description">
          A simplified terrain-based model for observing sediment movement
          across changing topography.
        </p>
      </header>


      <section class="controls">

        <!-- MATERIAL -->

        <details open>
          <summary>MATERIAL</summary>

          <div class="details-body">

            <div
              class="control"
              data-tip="Controls how quickly sediment parcels lose velocity during movement."
            >
              <div class="label-row">
                <label for="materialFriction">
                  MATERIAL FRICTION
                </label>

                <input
                  id="materialFrictionNumber"
                  class="numeric-input"
                  type="number"
                  min="0"
                  max="1"
                  step="0.01"
                  value="0.35"
                >
              </div>

              <input
                id="materialFriction"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.35"
              >
            </div>


            <div
              class="control"
              data-tip="Initial movement impulse given to newly released sediment."
            >
              <div class="label-row">
                <label for="startVelocity">
                  START VELOCITY
                </label>

                <input
                  id="startVelocityNumber"
                  class="numeric-input"
                  type="number"
                  min="0"
                  max="5"
                  step="0.05"
                  value="1"
                >
              </div>

              <input
                id="startVelocity"
                type="range"
                min="0"
                max="5"
                step="0.05"
                value="1"
              >
            </div>

          </div>
        </details>


        <!-- TERRAIN -->

        <details open>
          <summary>TERRAIN</summary>

          <div class="details-body">

            <div
              class="control"
              data-tip="Higher values create more terrain detail but require more computation."
            >
              <div class="label-row">
                <label for="terrainResolution">
                  TERRAIN RESOLUTION
                </label>

                <input
                  id="terrainResolutionNumber"
                  class="numeric-input"
                  type="number"
                  min="64"
                  max="768"
                  step="1"
                  value="256"
                >
              </div>

              <input
                id="terrainResolution"
                type="range"
                min="64"
                max="768"
                step="1"
                value="256"
              >
            </div>

          </div>
        </details>


        <!-- MODEL -->

        <details>
          <summary>MODEL</summary>

          <div class="details-body">

            <div
              class="control"
              data-tip="Uniform scale applied to the imported terrain."
            >
              <div class="label-row">
                <label for="modelScale">
                  MODEL SCALE
                </label>

                <input
                  id="modelScaleNumber"
                  class="numeric-input"
                  type="number"
                  min="0.1"
                  max="1000"
                  step="0.1"
                  value="1"
                >
              </div>

              <input
                id="modelScale"
                type="range"
                min="0.1"
                max="1000"
                step="0.1"
                value="1"
              >
            </div>


            <div
              class="control"
              data-tip="Multiplies terrain height without changing its horizontal dimensions."
            >
              <div class="label-row">
                <label for="verticalExaggeration">
                  VERTICAL SCALE
                </label>

                <input
                  id="verticalExaggerationNumber"
                  class="numeric-input"
                  type="number"
                  min="0.1"
                  max="20"
                  step="0.1"
                  value="1"
                >
              </div>

              <input
                id="verticalExaggeration"
                type="range"
                min="0.1"
                max="20"
                step="0.1"
                value="1"
              >
            </div>


            <div
              class="control"
              data-tip="Scales the terrain depth axis. The default value is 1.0."
            >
              <div class="label-row">
                <label for="depthScale">
                  DEPTH SCALE Z
                </label>

                <input
                  id="depthScaleNumber"
                  class="numeric-input"
                  type="number"
                  min="0.1"
                  max="20"
                  step="0.1"
                  value="1"
                >
              </div>

              <input
                id="depthScale"
                type="range"
                min="0.1"
                max="20"
                step="0.1"
                value="1"
              >
            </div>

          </div>
        </details>


        <!-- SOURCE VOLUME -->

        <details open>
          <summary>SOURCE VOLUME</summary>

          <div class="details-body">

            <div
              class="control"
              data-tip="Total physical sediment volume represented by the simulation."
            >
              <div class="label-row">
                <label for="sourceVolume">
                  SOURCE VOLUME m³
                </label>

                <input
                  id="sourceVolumeNumber"
                  class="numeric-input"
                  type="number"
                  min="1"
                  max="1000000"
                  step="1"
                  value="8"
                >
              </div>

              <input
                id="sourceVolume"
                type="range"
                min="1"
                max="1000000"
                step="1"
                value="8"
              >
            </div>


            <div
              class="control"
              data-tip="Width and depth of the release area. The release height is calculated from the selected volume."
            >
              <div class="label-row">
                <label for="sourceFootprint">
                  RELEASE AREA X/Z
                </label>

                <input
                  id="sourceFootprintNumber"
                  class="numeric-input"
                  type="number"
                  min="0.25"
                  max="1000"
                  step="0.25"
                  value="2"
                >
              </div>

              <input
                id="sourceFootprint"
                type="range"
                min="0.25"
                max="1000"
                step="0.25"
                value="2"
              >
            </div>


            <div
              class="control"
              data-tip="Number of simulated debris parcels per cubic metre. A safety cap is applied for very large simulations."
            >
              <div class="label-row">
                <label for="debrisDensity">
                  DEBRIS / m³
                </label>

                <input
                  id="debrisDensityNumber"
                  class="numeric-input"
                  type="number"
                  min="0.01"
                  max="10"
                  step="0.01"
                  value="1"
                >
              </div>

              <input
                id="debrisDensity"
                type="range"
                min="0.01"
                max="10"
                step="0.01"
                value="1"
              >
            </div>


            <div class="control">
              <div class="label-row">
                <label for="particleVisualization">
                  VISUALIZATION
                </label>

                <select id="particleVisualization">
                  <option value="points">
                    POINT SPRITES
                  </option>

                  <option value="spheres">
                    MESH SOUP
                  </option>
                </select>
              </div>
            </div>


            <div
              class="control"
              data-tip="Visual scale for point sprites. Mesh-soup parcels use their calculated physical volume."
            >
              <div class="label-row">
                <label for="particleSize">
                  POINT DISPLAY SCALE
                </label>

                <input
                  id="particleSizeNumber"
                  class="numeric-input"
                  type="number"
                  min="0.25"
                  max="3"
                  step="0.05"
                  value="1"
                >
              </div>

              <input
                id="particleSize"
                type="range"
                min="0.25"
                max="3"
                step="0.05"
                value="1"
              >
            </div>

          </div>
        </details>


        <!-- MODEL ORIENTATION -->

        <details>
          <summary>MODEL ORIENTATION</summary>

          <div class="details-body">

            <div class="control">
              <div class="label-row">
                <label for="rotationX">
                  ROTATE X
                </label>

                <input
                  id="rotationXNumber"
                  class="numeric-input"
                  type="number"
                  min="-180"
                  max="180"
                  step="45"
                  value="0"
                >
              </div>

              <input
                id="rotationX"
                type="range"
                min="-180"
                max="180"
                step="45"
                value="0"
              >
            </div>


            <div class="control">
              <div class="label-row">
                <label for="rotationY">
                  ROTATE Y
                </label>

                <input
                  id="rotationYNumber"
                  class="numeric-input"
                  type="number"
                  min="-180"
                  max="180"
                  step="45"
                  value="0"
                >
              </div>

              <input
                id="rotationY"
                type="range"
                min="-180"
                max="180"
                step="45"
                value="0"
              >
            </div>


            <div class="control">
              <div class="label-row">
                <label for="rotationZ">
                  ROTATE Z
                </label>

                <input
                  id="rotationZNumber"
                  class="numeric-input"
                  type="number"
                  min="-180"
                  max="180"
                  step="45"
                  value="0"
                >
              </div>

              <input
                id="rotationZ"
                type="range"
                min="-180"
                max="180"
                step="45"
                value="0"
              >
            </div>

          </div>
        </details>


        <!-- BUTTONS -->

        <div class="button-row">
          <button
            id="resetOrientationButton"
            type="button"
          >
            RESET ROTATION
          </button>
        </div>

        <div class="button-row">
          <button
            id="playButton"
            type="button"
          >
            PLAY
          </button>

          <button
            id="resetButton"
            type="button"
          >
            RESET
          </button>
        </div>

        <div class="button-row secondary">
          <button
            id="addButton"
            type="button"
          >
            ADD MATERIAL
          </button>

          <button
            id="terrainButton"
            type="button"
          >
            NEW TERRAIN
          </button>
        </div>

      </section>


      <!-- MODEL IMPORT -->

      <div id="dropZone">
        DROP 3D TERRAIN HERE
        <span>PLY / STL / OBJ</span>
      </div>

      <input
        id="modelFileInput"
        type="file"
        accept=".ply,.stl,.obj"
        hidden
      >

      <button
        id="chooseModelButton"
        class="file-button"
        type="button"
      >
        CHOOSE 3D MODEL
      </button>


      <div id="sourceHint">
        SHIFT + LEFT CLICK TO PLACE SOURCE
      </div>


      <footer>
        <span id="status">
          PAUSED
        </span>

        <span id="particleCountStatus">
          8 PARCELS
        </span>
      </footer>

    </aside>

  </main>

  <script
    type="module"
    src="./app.js"
  ></script>
</body>
</html>
