<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dynamic Landscape Tool</title>

  <link rel="stylesheet" href="style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <main id="app">

    <section id="viewer"></section>

    <aside id="interface">

      <header>
        <div class="eyebrow">REAL-TIME LANDSCAPE MODEL</div>

        <h1>SEDIMENT<br>FLOW</h1>

        <p class="description">
          An exploratory particle-based model for observing sediment movement
          across a terrain.
        </p>
      </header>

      <section class="controls">

        <div class="control">
          <div class="label-row">
            <label for="flow">FLOW</label>
            <output id="flowValue">0.50</output>
          </div>
          <input id="flow" type="range" min="0" max="1" step="0.01" value="0.50">
        </div>

        <div class="control">
          <div class="label-row">
            <label for="slope">SLOPE</label>
            <output id="slopeValue">0.50</output>
          </div>
          <input id="slope" type="range" min="0" max="1" step="0.01" value="0.50">
        </div>

        <div class="control">
          <div class="label-row">
            <label for="friction">FRICTION</label>
            <output id="frictionValue">0.35</output>
          </div>
          <input id="friction" type="range" min="0" max="1" step="0.01" value="0.35">
        </div>

        <div class="control">
          <div class="label-row">
            <label for="material">MATERIAL</label>
            <output id="materialValue">0.60</output>
          </div>
          <input id="material" type="range" min="0" max="1" step="0.01" value="0.60">
        </div>

        <div class="control">
          <div class="label-row">
            <label for="terrainResolution">TERRAIN RESOLUTION</label>
            <output id="terrainResolutionValue">128</output>
          </div>
          <input
            id="terrainResolution"
            type="range"
            min="32"
            max="1026"
            step="2"
            value="128"
          >
        </div>

        <div class="control">
          <div class="label-row">
            <label for="particleCount">PARTICLES</label>
            <output id="particleCountValue">3500</output>
          </div>
          <input
            id="particleCount"
            type="range"
            min="500"
            max="10000"
            step="500"
            value="3500"
          >
        </div>

        <div class="control">
          <div class="label-row">
            <label for="sourceVolume">SOURCE VOLUME m³</label>
            <output id="sourceVolumeValue">8</output>
          </div>
          <input
            id="sourceVolume"
            type="range"
            min="1"
            max="1000"
            step="1"
            value="8"
          >
        </div>

        <div class="button-row">
          <button id="playButton" type="button">PLAY</button>
          <button id="resetButton" type="button">RESET</button>
        </div>

        <div class="button-row secondary">
          <button id="addButton" type="button">ADD SEDIMENT</button>
          <button id="terrainButton" type="button">NEW TERRAIN</button>
        </div>

      </section>

      <div id="dropZone">
        DROP 3D TERRAIN HERE
        <span>PLY / STL / OBJ</span>
      </div>

      <div id="sourceHint">
        SHIFT + LEFT CLICK TO PLACE SOURCE
      </div>

      <footer>
        <span id="status">PAUSED</span>
        <span id="particleCountStatus">3500 PARTICLES</span>
      </footer>

    </aside>

  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
