<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dynamic Landscape Tool</title>

  <link rel="stylesheet" href="style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <main id="app">

    <section id="viewer"></section>

    <aside id="interface">

      <header>
        <div class="eyebrow">
          REAL-TIME LANDSCAPE MODEL
        </div>

        <h1>
          SEDIMENT<br>
          FLOW
        </h1>

        <p class="description">
          A simplified terrain-based model for observing sediment movement
          across changing topography.
        </p>
      </header>

      <section class="controls">

        <div class="section-label">
          TERRAIN
        </div>

        <div class="control" data-tip="Controls how strongly particles slow down when moving across the terrain.">
          <div class="label-row">
            <label for="terrainFriction">
              TERRAIN FRICTION
            </label>

            <input
              id="terrainFrictionNumber"
              class="numeric-input"
              type="number"
              min="0"
              max="1"
              step="0.01"
              value="0.35"
            >
          </div>

          <input
            id="terrainFriction"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.35"
          >
        </div>

        <div class="control" data-tip="Defines the resolution of the generated terrain grid. Higher values create more detail but require more computation.">
          <div class="label-row">
            <label for="terrainResolution">
              TERRAIN RESOLUTION
            </label>

            <input
              id="terrainResolutionNumber"
              class="numeric-input"
              type="number"
              min="64"
              max="768"
              step="1"
              value="256"
            >
          </div>

          <input
            id="terrainResolution"
            type="range"
            min="64"
            max="768"
            step="1"
            value="256"
          >
        </div>

        <div class="control" data-tip="Scales the imported model horizontally within the viewer.">
          <div class="label-row">
            <label for="modelScale">
              MODEL SCALE
            </label>

            <input
              id="modelScaleNumber"
              class="numeric-input"
              type="number"
              min="0.1"
              max="1000"
              step="0.1"
              value="1.0"
            >
          </div>

          <input
            id="modelScale"
            type="range"
            min="0.1"
            max="1000"
            step="0.1"
            value="1.0"
          >
        </div>

        <div class="control" data-tip="Controls the vertical height of the terrain. The default value 1.0 preserves the original proportions.">
          <div class="label-row">
            <label for="verticalExaggeration">
              VERTICAL SCALE
            </label>

            <input
              id="verticalExaggerationNumber"
              class="numeric-input"
              type="number"
              min="0.1"
              max="20"
              step="0.1"
              value="1.0"
            >
          </div>

          <input
            id="verticalExaggeration"
            type="range"
            min="0.1"
            max="20"
            step="0.1"
            value="1.0"
          >
        </div>

        <div class="section-label terrain-label">
          SOURCE
        </div>

        <div class="control" data-tip="Sets the amount of sediment particles released at the source location.">
          <div class="label-row">
            <label for="sourceVolume">
              SOURCE VOLUME m³
            </label>

            <input
              id="sourceVolumeNumber"
              class="numeric-input"
              type="number"
              min="1"
              max="1000"
              step="1"
              value="8"
            >
          </div>

          <input
            id="sourceVolume"
            type="range"
            min="1"
            max="1000"
            step="1"
            value="8"
          >
        </div>

        <div class="control" data-tip="Controls the visual size of the sediment particles.">
          <div class="label-row">
            <label for="particleSize">
              PARTICLE SIZE
            </label>

            <input
              id="particleSizeNumber"
              class="numeric-input"
              type="number"
              min="2"
              max="24"
              step="1"
              value="7"
            >
          </div>

          <input
            id="particleSize"
            type="range"
            min="2"
            max="24"
            step="1"
            value="7"
          >
        </div>

        <div class="section-label terrain-label">
          MODEL ORIENTATION
        </div>

        <div class="control" data-tip="Rotates the imported model around the X axis in 45-degree steps.">
          <div class="label-row">
            <label for="rotationX">
              ROTATE X
            </label>

            <input
              id="rotationXNumber"
              class="numeric-input"
              type="number"
              min="-180"
              max="180"
              step="45"
              value="0"
            >
          </div>

          <input
            id="rotationX"
            type="range"
            min="-180"
            max="180"
            step="45"
            value="0"
          >
        </div>

        <div class="control" data-tip="Rotates the imported model around the Y axis in 45-degree steps.">
          <div class="label-row">
            <label for="rotationY">
              ROTATE Y
            </label>

            <input
              id="rotationYNumber"
              class="numeric-input"
              type="number"
              min="-180"
              max="180"
              step="45"
              value="0"
            >
          </div>

          <input
            id="rotationY"
            type="range"
            min="-180"
            max="180"
            step="45"
            value="0"
          >
        </div>

        <div class="control" data-tip="Rotates the imported model around the Z axis in 45-degree steps.">
          <div class="label-row">
            <label for="rotationZ">
              ROTATE Z
            </label>

            <input
              id="rotationZNumber"
              class="numeric-input"
              type="number"
              min="-180"
              max="180"
              step="45"
              value="0"
            >
          </div>

          <input
            id="rotationZ"
            type="range"
            min="-180"
            max="180"
            step="45"
            value="0"
          >
        </div>

        <div class="button-row">
          <button
            id="resetOrientationButton"
            type="button"
          >
            RESET ROTATION
          </button>
        </div>

        <div class="button-row">
          <button
            id="playButton"
            type="button"
          >
            PLAY
          </button>

          <button
            id="resetButton"
            type="button"
          >
            RESET
          </button>
        </div>

        <div class="button-row secondary">
          <button
            id="addButton"
            type="button"
          >
            ADD MATERIAL
          </button>

          <button
            id="terrainButton"
            type="button"
          >
            NEW TERRAIN
          </button>
        </div>

      </section>

      <div id="dropZone">
        DROP 3D TERRAIN HERE
        <span>PLY / STL / OBJ</span>
      </div>

      <input
        id="modelFileInput"
        type="file"
        accept=".ply,.stl,.obj"
        hidden
      >

      <button
        id="chooseModelButton"
        class="file-button"
        type="button"
      >
        CHOOSE 3D MODEL
      </button>

      <div id="sourceHint">
        SHIFT + LEFT CLICK TO PLACE SOURCE
      </div>

      <footer>
        <span id="status">
          PAUSED
        </span>

        <span id="particleCountStatus">
          8 PARTICLES
        </span>
      </footer>

    </aside>

  </main>

  <script
    type="module"
    src="app.js"
  ></script>
</body>
</html>
