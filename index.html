<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dynamic Landscape Tool</title>

  <link rel="stylesheet" href="./style.css">

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <main id="app">

    <section id="viewer"></section>

    <aside id="interface">

      <header>
        <div class="eyebrow">
          REAL-TIME LANDSCAPE MODEL
        </div>

        <h1>
          SEDIMENT<br>
          FLOW
        </h1>

        <p class="description">
          A simplified terrain-based model for observing sediment movement
          across changing topography.
        </p>
      </header>


      <section class="controls">

        <!-- MATERIAL -->

        <details open>
          <summary>MATERIAL</summary>

          <div class="details-body">

            <div
              class="control"
              data-tip="Friction between individual sediment particles."
            >
              <div class="label-row">
                <label for="materialFriction">
                  MATERIAL FRICTION
                </label>

                <input
                  id="materialFrictionNumber"
                  class="numeric-input"
                  type="number"
                  min="0"
                  max="1"
                  step="0.01"
                  value="0.35"
                >
              </div>

              <input
                id="materialFriction"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.35"
              >
            </div>


            <div
              class="control"
              data-tip="Friction between sediment particles and the terrain."
            >
              <div class="label-row">
                <label for="terrainFriction">
                  TERRAIN FRICTION
                </label>

                <input
                  id="terrainFrictionNumber"
                  class="numeric-input"
                  type="number"
                  min="0"
                  max="1"
                  step="0.01"
                  value="0.65"
                >
              </div>

              <input
                id="terrainFriction"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.65"
              >
            </div>


            <div
              class="control"
              data-tip="Controls how strongly nearby particles attract one another."
            >
              <div class="label-row">
                <label for="particleCohesion">
                  PARTICLE COHESION
                </label>

                <input
                  id="particleCohesionNumber"
                  class="numeric-input"
                  type="number"
                  min="0"
                  max="1"
                  step="0.01"
                  value="0.35"
                >
              </div>

              <input
                id="particleCohesion"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.35"
              >
            </div>


            <div
              class="control"
              data-tip="Initial movement speed in metres per second."
            >
              <div class="label-row">
                <label for="startVelocity">
                  START VELOCITY m/s
                </label>

                <input
                  id="startVelocityNumber"
                  class="numeric-input"
                  type="number"
                  min="0"
                  max="10"
                  step="0.1"
                  value="1"
                >
              </div>

              <input
                id="startVelocity"
                type="range"
                min="0"
                max="10"
                step="0.1"
                value="1"
              >
            </div>


            <div
              class="control"
              data-tip="Multiplier for the simulated physical time."
            >
              <div class="label-row">
                <label for="simulationSpeed">
                  SIMULATION SPEED ×
                </label>

                <input
                  id="simulationSpeedNumber"
                  class="numeric-input"
                  type="number"
                  min="0.25"
                  max="5"
                  step="0.25"
                  value="1"
                >
              </div>

              <input
                id="simulationSpeed"
                type="range"
                min="0.25"
                max="5"
                step="0.25"
                value="1"
              >
            </div>


            <div class="control">
              <div class="label-row">
                <label for="startDirectionMode">
                  START DIRECTION
                </label>

                <select id="startDirectionMode">
                  <option value="downhill">
                    DOWNHILL
                  </option>

                  <option value="fixed">
                    FIXED HEADING
                  </option>

                  <option value="radial">
                    RADIAL FROM SOURCE
                  </option>

                  <option value="vector">
                    USER VECTOR
                  </option>
                </select>
              </div>
            </div>


            <div
              id="fixedDirectionControl"
              class="control direction-control hidden"
              data-tip="Heading in degrees. 0° points toward positive Z, 90° points toward positive X."
            >
              <div class="label-row">
                <label for="directionAngle">
                  HEADING °
                </label>

                <input
                  id="directionAngleNumber"
                  class="numeric-input"
                  type="number"
                  min="-180"
                  max="180"
                  step="1"
                  value="0"
                >
              </div>

              <input
                id="directionAngle"
                type="range"
                min="-180"
                max="180"
                step="1"
                value="0"
              >
            </div>


            <div
              id="userDirectionXControl"
              class="control direction-control hidden"
              data-tip="User-defined horizontal direction vector X component."
            >
              <div class="label-row">
                <label for="directionX">
                  VECTOR X
                </label>

                <input
                  id="directionXNumber"
                  class="numeric-input"
                  type="number"
                  min="-1"
                  max="1"
                  step="0.01"
                  value="0"
                >
              </div>

              <input
                id="directionX"
                type="range"
                min="-1"
                max="1"
                step="0.01"
                value="0"
              >
            </div>


            <div
              id="userDirectionZControl"
              class="control direction-control hidden"
              data-tip="User-defined horizontal direction vector Z component."
            >
              <div class="label-row">
                <label for="directionZ">
                  VECTOR Z
                </label>

                <input
                  id="directionZNumber"
                  class="numeric-input"
                  type="number"
                  min="-1"
                  max="1"
                  step="0.01"
                  value="1"
                >
              </div>

              <input
                id="directionZ"
                type="range"
                min="-1"
                max="1"
                step="0.01"
                value="1"
              >
            </div>

          </div>
        </details>


        <!-- TERRAIN -->

        <details open>
          <summary>TERRAIN</summary>

          <div class="details-body">

            <div
              class="control"
              data-tip="Number of terrain subdivisions."
            >
              <div class="label-row">
                <label for="terrainResolution">
                  TERRAIN RESOLUTION
                </label>

                <input
                  id="terrainResolutionNumber"
                  class="numeric-input"
                  type="number"
                  min="64"
                  max="768"
                  step="1"
                  value="256"
                >
              </div>

              <input
                id="terrainResolution"
                type="range"
                min="64"
                max="768"
                step="1"
                value="256"
              >
            </div>

          </div>
        </details>


        <!-- MODEL -->

        <details>
          <summary>MODEL</summary>

          <div class="details-body">

            <div
              class="control"
              data-tip="Visual multiplier applied to the terrain."
            >
              <div class="label-row">
                <label for="modelScale">
                  MODEL SCALE ×
                </label>

                <input
                  id="modelScaleNumber"
                  class="numeric-input"
                  type="number"
                  min="0.1"
                  max="1000"
                  step="0.1"
                  value="1"
                >
              </div>

              <input
                id="modelScale"
                type="range"
                min="0.1"
                max="1000"
                step="0.1"
                value="1"
              >
            </div>


            <div
              class="control"
              data-tip="Physical conversion from imported model units to metres."
            >
              <div class="label-row">
                <label for="metersPerModelUnit">
                  METRES / MODEL UNIT
                </label>

                <input
                  id="metersPerModelUnitNumber"
                  class="numeric-input"
                  type="number"
                  min="0.01"
                  max="100"
                  step="0.01"
                  value="1"
                >
              </div>

              <input
                id="metersPerModelUnit"
                type="range"
                min="0.01"
                max="100"
                step="0.01"
                value="1"
              >
            </div>


            <div
              class="control"
              data-tip="Vertical terrain exaggeration multiplier."
            >
              <div class="label-row">
                <label for="verticalExaggeration">
                  VERTICAL SCALE ×
                </label>

                <input
                  id="verticalScaleNumber"
                  class="numeric-input"
                  type="number"
                  min="0.1"
                  max="20"
                  step="0.1"
                  value="1"
                >
              </div>

              <input
                id="verticalExaggeration"
                type="range"
                min="0.1"
                max="20"
                step="0.1"
                value="1"
              >
            </div>


            <div
              class="control"
              data-tip="Independent depth-axis multiplier. The default is 1.0."
            >
              <div class="label-row">
                <label for="depthScale">
                  Z AXIS SCALE ×
                </label>

                <input
                  id="depthScaleNumber"
                  class="numeric-input"
                  type="number"
                  min="0.1"
                  max="20"
                  step="0.1"
                  value="1"
                >
              </div>

              <input
                id="depthScale"
                type="range"
                min="0.1"
                max="20"
                step="0.1"
                value="1"
              >
            </div>

          </div>
        </details>


        <!-- SOURCE MATERIAL -->

        <details open>
          <summary>SOURCE MATERIAL</summary>

          <div class="details-body">

            <div
              class="control"
              data-tip="Total physical volume of source material."
            >
              <div class="label-row">
                <label for="sourceVolume">
                  SOURCE VOLUME m³
                </label>

                <input
                  id="sourceVolumeNumber"
                  class="numeric-input"
                  type="number"
                  min="1000"
                  max="1000000"
                  step="1000"
                  value="10000"
                >
              </div>

              <input
                id="sourceVolume"
                type="range"
                min="1000"
                max="1000000"
                step="1000"
                value="10000"
              >
            </div>


            <div
              class="control"
              data-tip="Horizontal area of the source material release."
            >
              <div class="label-row">
                <label for="sourceArea">
                  RELEASE AREA m²
                </label>

                <input
                  id="sourceAreaNumber"
                  class="numeric-input"
                  type="number"
                  min="100"
                  max="100000"
                  step="100"
                  value="100"
                >
              </div>

              <input
                id="sourceArea"
                type="range"
                min="100"
                max="100000"
                step="100"
                value="100"
              >
            </div>


            <div
              class="control"
              data-tip="Number of simulated particles generated per cubic metre."
            >
              <div class="label-row">
                <label for="particleDensity">
                  PARTICLES / m³
                </label>

                <input
                  id="particleDensityNumber"
                  class="numeric-input"
                  type="number"
                  min="0.01"
                  max="10"
                  step="0.01"
                  value="1"
                >
              </div>

              <input
                id="particleDensity"
                type="range"
                min="0.01"
                max="10"
                step="0.01"
                value="1"
              >
            </div>


            <div class="control">
              <div class="label-row">
                <label for="particleVisualization">
                  VISUALIZATION
                </label>

                <select id="particleVisualization">
                  <option value="points">
                    POINT PARTICLES
                  </option>

                  <option value="soup">
                    CONNECTED SOUP
                  </option>
                </select>
              </div>
            </div>


            <div
              class="control"
              data-tip="Particles connect visually when their centers are within this multiple of their physical diameter."
            >
              <div class="label-row">
                <label for="soupLinkRange">
                  SOUP LINK RANGE × DIAMETER
                </label>

                <input
                  id="soupLinkRangeNumber"
                  class="numeric-input"
                  type="number"
                  min="0.75"
                  max="4"
                  step="0.05"
                  value="1.25"
                >
              </div>

              <input
                id="soupLinkRange"
                type="range"
                min="0.75"
                max="4"
                step="0.05"
                value="1.25"
              >
            </div>


            <div class="control">
              <div class="label-row">
                <label for="colorMode">
                  COLOR BY
                </label>

                <select id="colorMode">
                  <option value="material">
                    MATERIAL
                  </option>

                  <option value="velocity">
                    VELOCITY
                  </option>

                  <option value="distance">
                    DISTANCE TRAVELED
                  </option>

                  <option value="thickness">
                    FLOW THICKNESS
                  </option>

                  <option value="age">
                    PARTICLE AGE
                  </option>
                </select>
              </div>
            </div>


            <div
              class="control"
              data-tip="Visual scale for point particles. Physical particle volume is unchanged."
            >
              <div class="label-row">
                <label for="particleSize">
                  PARTICLE DISPLAY SCALE ×
                </label>

                <input
                  id="particleSizeNumber"
                  class="numeric-input"
                  type="number"
                  min="0.25"
                  max="3"
                  step="0.05"
                  value="1"
                >
              </div>

              <input
                id="particleSize"
                type="range"
                min="0.25"
                max="3"
                step="0.05"
                value="1"
              >
            </div>

          </div>
        </details>


        <!-- MODEL ORIENTATION -->

        <details>
          <summary>MODEL ORIENTATION</summary>

          <div class="details-body">

            <div class="control">
              <div class="label-row">
                <label for="rotationX">
                  ROTATE X °
                </label>

                <input
                  id="rotationXNumber"
                  class="numeric-input"
                  type="number"
                  min="-180"
                  max="180"
                  step="45"
                  value="0"
                >
              </div>

              <input
                id="rotationX"
                type="range"
                min="-180"
                max="180"
                step="45"
                value="0"
              >
            </div>


            <div class="control">
              <div class="label-row">
                <label for="rotationY">
                  ROTATE Y °
                </label>

                <input
                  id="rotationYNumber"
                  class="numeric-input"
                  type="number"
                  min="-180"
                  max="180"
                  step="45"
                  value="0"
                >
              </div>

              <input
                id="rotationY"
                type="range"
                min="-180"
                max="180"
                step="45"
                value="0"
              >
            </div>


            <div class="control">
              <div class="label-row">
                <label for="rotationZ">
                  ROTATE Z °
                </label>

                <input
                  id="rotationZNumber"
                  class="numeric-input"
                  type="number"
                  min="-180"
                  max="180"
                  step="45"
                  value="0"
                >
              </div>

              <input
                id="rotationZ"
                type="range"
                min="-180"
                max="180"
                step="45"
                value="0"
              >
            </div>

          </div>
        </details>


        <!-- BUTTONS -->

        <div class="button-row">
          <button
            id="resetOrientationButton"
            type="button"
          >
            RESET ROTATION
          </button>
        </div>

        <div class="button-row">
          <button
            id="playButton"
            type="button"
          >
            PLAY
          </button>

          <button
            id="resetButton"
            type="button"
          >
            RESET
          </button>
        </div>

        <div class="button-row secondary">
          <button
            id="addButton"
            type="button"
          >
            ADD 1000 m³
          </button>

          <button
            id="terrainButton"
            type="button"
          >
            NEW TERRAIN
          </button>
        </div>

      </section>


      <div id="dropZone">
        DROP 3D TERRAIN HERE
        <span>PLY / STL / OBJ</span>
      </div>

      <input
        id="modelFileInput"
        type="file"
        accept=".ply,.stl,.obj"
        hidden
      >

      <button
        id="chooseModelButton"
        class="file-button"
        type="button"
      >
        CHOOSE 3D MODEL
      </button>


      <div id="sourceHint">
        SHIFT + LEFT CLICK TO PLACE SOURCE
      </div>


      <footer>
        <span id="status">
          PAUSED
        </span>

        <span id="particleCountStatus">
          10,000 PARTICLES
        </span>
      </footer>

    </aside>

  </main>

  <script
    type="module"
    src="./app.js"
  ></script>
</body>
</html>
